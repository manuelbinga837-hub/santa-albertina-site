<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema Escolar Santa Albertina" />
    <title>Santa Albertina</title>

    <script>
      (function () {
        var base = "/santa-albertina-site";
        var search = window.location.search;

        if (search.startsWith("?/")) {
          var route = search.slice(2).split("&")[0];
          var remaining = search.slice(2 + route.length);

          var newUrl = base + "/" + route;

          if (remaining) {
            newUrl += "?" + remaining.replace(/^&/, "");
          }

          if (window.location.hash) {
            newUrl += window.location.hash;
          }

          window.history.replaceState(null, "", newUrl);
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="/santa-albertina-site/src/main.js"></script>
  </body>
</html>
